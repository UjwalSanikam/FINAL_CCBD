services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: chaincheck-ollama
    # No volume mounted at /root/.ollama on purpose: phi3 is baked into the
    # image at build time (see Dockerfile.ollama). Mounting a volume there
    # would shadow it with an empty directory on first run.
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chaincheck-app
    ports:
      - "8765:8765"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_TIMEOUT_S=120
      - CHAINCHECK_USE_TRANSFORMER=1
      - HF_HOME=/app/data/.hf_cache
      - HF_HUB_OFFLINE=1
      - HF_HUB_CACHE=/app/data/.hf_cache
    volumes:
      - ./data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
